# ============================================================
# Prevent_DNS_Leak_Fix - 自安装修复模块 (2026-08-20)
# ------------------------------------------------------------
# 问题:
#   OpenClash v0.47.156 中, 覆写模块 [Overwrite] 段 ruby 的
#   groups/rules 修改会被 [General] 段处理覆盖, 导致
#   COCR-DNS-Leak-Guard / MATCH 重定向 / no-resolve 补全不落地。
#   (模块 [Overwrite] 通道 bug, GitHub issue #5280 同类, 无官方修复)
# 方案:
#   用 [General] DOWNLOAD_FILE 把仓库版完整 custom 脚本
#   (custom/openclash_custom_overwrite.sh, 含 Prevent ruby 修复)
#   自动下载到 /etc/openclash/custom/ 并覆盖。
#   custom 脚本通道 (init.d 3644 行) 在模块覆写之后执行, 修改可落地。
# 效果:
#   - 纯订阅格式: 添加本模块条目即可, 无需手工改任何文件
#   - 全效果落地: COCR 组 / MATCH,COCR-DNS-Leak-Guard /
#     respect-rules / proxy-server-nameserver / no-resolve
#   - 自动更新: cron=0 4 * * * 每天 4 点同步仓库最新脚本
# 前置:
#   仍须启用 Aethersailor Prevent_DNS_Leak 模块
#   ([General] 段提供 respect-rules / proxy-server-nameserver 设置)
# ============================================================
[General]
DOWNLOAD_FILE = url=https://testingcf.jsdelivr.net/gh/shwx123/openclash-overrides@main/custom/openclash_custom_overwrite.sh, path=/etc/openclash/custom/openclash_custom_overwrite.sh, force=true, cron=0 4 * * *
